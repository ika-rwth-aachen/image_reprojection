/*/**:
  ros__parameters:

    input:
      image_topics:
        - /drivers/zed_camera/front_center/left/image_rect_color
        - /drivers/zed_camera/front_left/left/image_rect_color
        - /drivers/zed_camera/front_right/left/image_rect_color
      /drivers/zed_camera/front_left/left/image_rect_color:
        image_transport: compressed
        camera_info_topic: /drivers/zed_camera/front_left/left/camera_info
      /drivers/zed_camera/front_center/left/image_rect_color:
        image_transport: compressed
        camera_info_topic: /drivers/zed_camera/front_center/left/camera_info
      /drivers/zed_camera/front_right/left/image_rect_color:
        image_transport: compressed
        camera_info_topic: /drivers/zed_camera/front_right/left/camera_info

    output:
      gstreamer:
        config_export_path: /gstreamer/projection.planar120.json
      projection:
        planar:
          enabled: true
          image_topic: /image_reprojection/planar120/image
          camera_info_topic: /image_reprojection/planar120/camera_info
          optical_frame_id: front_center_left_camera_optical_frame
          width: 2560
          height: 590
          depth: 10.0
          fov_x: 120.0
          blend_factor: 0.0
        equirectangular:
          enabled: false

    params:
      recompute_every_frame: false
      transform_timeout: 0.05
      frame_timeout: 0.1
      frame_time_tolerance: 0.033
      sync_mode: wait_all
