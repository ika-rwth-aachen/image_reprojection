  # image-reprojection.planar-bev.static-tf-broadcaster:
  #   image: rwthika/ros2:jazzy-desktop-full
  #   command:
  #     - /bin/bash
  #     - -c
  #     - >
  #       ros2 run tf2_ros static_transform_publisher --frame-id base_link --child-frame-id bev --z 100.0 --pitch 1.5758 --yaw 1.5758 --y 1.0 &
  #       ros2 run tf2_ros static_transform_publisher --frame-id bev --child-frame-id bev_optical --roll -1.5758 --yaw -1.5758

  rosbag-play:
    image: ghcr.io/ika-rwth-aachen/image_reprojection:demo-rosbag
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    command: ros2 bag play --loop --delay 3 /data/rosbag

  rviz:
    image: rwthika/ros2-cuda:jazzy-desktop-full
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      DISPLAY: ${DISPLAY}
    command: rviz2 -d /config.rviz
    volumes:
      - ./viz/config.rviz:/config.rviz
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  rqt:
    image: rwthika/ros2-cuda:jazzy-desktop-full
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      DISPLAY: ${DISPLAY}
    command: rqt --perspective-file /rqt.perspective
    volumes:
      - ./viz/rqt.perspective:/rqt.perspective
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
