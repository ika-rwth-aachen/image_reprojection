services:

  image-reprojection.planar120:
    image: ghcr.io/ika-rwth-aachen/image_reprojection:v1.1.1
    command: ros2 launch image_reprojection image_reprojection_launch.py name:=image_reprojection_planar120
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    volumes:
      - ./image_reprojection/params.planar120.yml:/docker-ros/ws/install/image_reprojection/share/image_reprojection/config/params.yml
      - ./gstreamer:/gstreamer

  image-reprojection.equirectangular360:
    image: ghcr.io/ika-rwth-aachen/image_reprojection:v1.1.1
    command: ros2 launch image_reprojection image_reprojection_launch.py name:=image_reprojection_equirectangular360
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    volumes:
      - ./image_reprojection/params.equirectangular360.yml:/docker-ros/ws/install/image_reprojection/share/image_reprojection/config/params.yml
      - ./gstreamer:/gstreamer

  # image-reprojection.planar-bev:
