openadservice:
  name: image-reprojection
  image: ghcr.io/ika-rwth-aachen/image_reprojection:v1.1.0
  env:
    # --- name ------
    NAMESPACE: /
    NAME: image_reprojection
    # --- other -----
    LOG_LEVEL: info
    USE_SIM_TIME: false
    PARAMS: /docker-ros/ws/install/image_reprojection/share/image_reprojection/config/params.yml
  args:
  - /bin/bash
  - -ic
  - |
    ros2 launch image_reprojection image_reprojection_launch.py \
      namespace:=${NAMESPACE} \
      name:=${NAME} \
      log_level:=${LOG_LEVEL} \
      use_sim_time:=${USE_SIM_TIME} \
      params:=${PARAMS}
  rosParamFileMountPath: /docker-ros/ws/install/image_reprojection/share/image_reprojection/config/params.yml
  rosParamFileData: null
