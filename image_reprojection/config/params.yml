image_reprojection:
  ros__parameters:
    # Synchronisation queue length for ApproximateTime
    sync_queue_size: 10

    # Virtual output camera intrinsics and frame definition
    virtual_camera:
      frame_id: ""
      width: 1280
      height: 720
      fx: 858.6144409179688
      fy: 858.6144409179688
      cx: 628.988037109375
      cy: 375.0443420410156
      plane_depth: 10.0

    # Published topics for the reprojected image and its CameraInfo
    output:
      image_topic: /image_reprojection/output/image
      camera_info_topic: /image_reprojection/output/camera_info

    # First input camera configuration (typically the reference camera)
    input0:
      image_topic: /drivers/zed_camera/front_center/left/image_rect_color
      camera_info_topic: /drivers/zed_camera/front_center/left/camera_info

    # Second input camera configuration
    input1:
      image_topic: /drivers/zed_camera/front_right/left/image_rect_color
      camera_info_topic: /drivers/zed_camera/front_right/left/camera_info

    # TF lookup timeout in seconds
    transform_timeout: 0.05
